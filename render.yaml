services:
  - type: web
    name: dehomyar
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/update
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: dehomyar-data
      mountPath: /var/data
      sizeGB: 1

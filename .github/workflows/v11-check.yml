name: DehomYar v12 checks
on:
  push:
    branches: ["feat/dahomyar-v12-learning-security"]
  pull_request:
    branches: ["main"]
jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node --check server.js
      - run: node --check ai-route.js
      - run: node --check ai-ui.js
      - run: node --check enhancements.js
      - run: node --check learning-hub.js
      - run: node ai-route.test.js
      - run: npm ci

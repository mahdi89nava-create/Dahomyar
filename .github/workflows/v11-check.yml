name: DehomYar v11 checks
on:
  push:
    branches: ["feat/dahomyar-refresh-v11"]
  pull_request:
    branches: ["main"]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node --check server.js
      - run: node --check enhancements.js
      - run: node --check ai-route.js
      - run: node --check ai-ui.js
      - run: npm ci
